<!doctype html>
<html lang="en">
<head>
<meta charset="utf-8">
<meta name="viewport" content="width=device-width,initial-scale=1">
<meta name="theme-color" content="#10120f">
<title>SIM/CITY — Choose Your World</title>
<link rel="preconnect" href="https://fonts.googleapis.com">
<link rel="preconnect" href="https://fonts.gstatic.com" crossorigin>
<link href="https://fonts.googleapis.com/css2?family=Cinzel:wght@500;600;700;800&family=Manrope:wght@400;500;600;700;800&display=swap" rel="stylesheet">
<style>
:root{color-scheme:dark;--ink:#f1eee5;--muted:#a8a99f;--gold:#d0b477;--line:rgba(231,220,190,.22)}
*{box-sizing:border-box}
html,body{margin:0;min-height:100%;background:#10120f;color:var(--ink)}
body{font-family:Manrope,Arial,sans-serif;min-height:100vh;overflow-x:hidden}
body:before{content:"";position:fixed;inset:0;pointer-events:none;background:radial-gradient(ellipse at 50% 0%,rgba(113,105,78,.2),transparent 48%),linear-gradient(180deg,#151812 0%,#10120f 70%);z-index:0}
.shell{position:relative;z-index:1;width:min(1500px,calc(100% - 72px));margin:auto}
header{height:86px;display:flex;align-items:center;justify-content:space-between;border-bottom:1px solid var(--line)}
.logo{font-family:Cinzel,serif;font-size:19px;font-weight:700;letter-spacing:.17em}.logo span{color:var(--gold)}
.header-right{font-size:10px;letter-spacing:.23em;color:#a9a99d;text-transform:uppercase}
main{padding:clamp(44px,7vh,82px) 0 72px}
.intro{text-align:center;margin-bottom:42px}
.kicker{font-size:10px;letter-spacing:.36em;color:var(--gold);text-transform:uppercase}
h1{font-family:Cinzel,Georgia,serif;font-weight:500;font-size:clamp(27px,4vw,46px);letter-spacing:.12em;text-transform:uppercase;margin:17px 0 0}
.rule{width:70px;height:1px;background:var(--gold);margin:22px auto 0;opacity:.75}
.games{display:grid;grid-template-columns:repeat(3,minmax(0,1fr));gap:18px}
.game{position:relative;display:block;min-height:clamp(390px,54vw,610px);overflow:hidden;color:var(--ink);text-decoration:none;border:1px solid rgba(220,210,180,.22);background:#242923;isolation:isolate}
.art{position:absolute;inset:0;z-index:-2;overflow:hidden;background:#26332f}
.art svg{width:100%;height:100%;display:block}
.art:after{content:"";position:absolute;inset:0;background:linear-gradient(180deg,rgba(6,9,8,.08) 0%,rgba(6,9,8,.03) 35%,rgba(6,9,8,.48) 68%,rgba(6,9,8,.96) 100%),linear-gradient(90deg,rgba(7,9,8,.16),transparent 55%,rgba(7,9,8,.12))}
.game:before{content:"";position:absolute;inset:10px;border:1px solid rgba(242,225,184,.0);transition:inset .45s,border-color .45s;pointer-events:none;z-index:2}
.game:hover:before{inset:17px;border-color:rgba(242,225,184,.55)}
.game:after{content:"";position:absolute;inset:0;background:linear-gradient(180deg,transparent 40%,rgba(8,10,8,.14) 55%,rgba(8,10,8,.76) 100%);opacity:.85;transition:opacity .35s;z-index:-1}
.game:hover:after{opacity:1}
.number{position:absolute;top:24px;left:25px;font:11px Manrope,sans-serif;letter-spacing:.22em;color:rgba(255,255,255,.75)}
.game-info{position:absolute;left:30px;right:30px;bottom:30px}
.genre{font-size:9px;letter-spacing:.25em;text-transform:uppercase;color:#ddc994;margin-bottom:12px}
h2{font-family:Cinzel,Georgia,serif;font-size:clamp(27px,3.3vw,43px);font-weight:600;letter-spacing:.06em;margin:0 0 20px;text-shadow:0 2px 18px rgba(0,0,0,.5)}
.launch{display:flex;align-items:center;gap:13px;font-size:10px;letter-spacing:.24em;text-transform:uppercase;color:#eee8d8}
.launch:before{content:"";width:30px;height:1px;background:var(--gold);transition:width .3s}
.launch:after{content:"↗";font-size:17px;color:var(--gold);margin-left:auto;transition:transform .3s}
.game:hover .launch:before{width:52px}.game:hover .launch:after{transform:translate(4px,-3px)}
footer{display:flex;justify-content:space-between;gap:20px;padding:22px 0 28px;border-top:1px solid var(--line);font-size:9px;letter-spacing:.18em;text-transform:uppercase;color:#77796f}
@media(max-width:900px){.shell{width:min(720px,calc(100% - 40px))}.games{grid-template-columns:1fr}.game{min-height:430px}.game-info{left:28px;right:28px;bottom:27px}h2{font-size:38px}main{padding-top:48px}}
@media(max-width:520px){.shell{width:calc(100% - 28px)}header{height:68px}.logo{font-size:15px}.header-right{font-size:8px;letter-spacing:.12em}.game{min-height:390px}.intro{margin-bottom:28px}footer{font-size:8px;flex-wrap:wrap}}
@media(prefers-reduced-motion:reduce){*,*:before,*:after{transition:none!important}}
</style>
</head>
