<!doctype html>
<html lang="en">
<head>
<meta charset="utf-8"><meta name="viewport" content="width=device-width,initial-scale=1"><meta name="theme-color" content="#11120f">
<title>SimCity — Projects</title>
<link rel="preconnect" href="https://fonts.googleapis.com"><link rel="preconnect" href="https://fonts.gstatic.com" crossorigin>
<link href="https://fonts.googleapis.com/css2?family=DM+Mono:wght@400;500&family=Manrope:wght@400;500;600;700;800&display=swap" rel="stylesheet">
<style>
:root{color-scheme:dark;--bg:#11120f;--panel:#191a16;--ink:#e9e6dc;--muted:#89877d;--line:#383930;--accent:#c5a878}
*{box-sizing:border-box}html{background:var(--bg)}body{margin:0;min-height:100vh;background:radial-gradient(ellipse at 50% -25%,#34352a 0,transparent 55%),var(--bg);color:var(--ink);font-family:Manrope, sans-serif}
.shell{width:min(1240px,calc(100% - 64px));margin:auto}header{height:88px;display:flex;align-items:center;justify-content:space-between;border-bottom:1px solid var(--line)}
.brand{font-size:13px;font-weight:800;letter-spacing:.2em}.brand span{color:var(--accent)}.meta,.eyebrow,.index,.launch,footer{font:10px "DM Mono",monospace;letter-spacing:.15em;text-transform:uppercase;color:var(--muted)}
main{padding:100px 0 92px}.eyebrow{color:var(--accent);display:flex;align-items:center;gap:14px}.eyebrow:before{content:"";width:28px;height:1px;background:var(--accent)}
h1{font-size:clamp(48px,8vw,100px);line-height:.98;letter-spacing:-.075em;font-weight:500;margin:26px 0 70px;max-width:850px}
h1 span{font-weight:800;color:var(--accent)}
.projects{display:grid;grid-template-columns:repeat(3,1fr);gap:16px}
.project{position:relative;display:flex;flex-direction:column;min-height:370px;padding:20px 21px 19px;text-decoration:none;color:var(--ink);background:var(--panel);border:1px solid var(--line);overflow:hidden;transition:border-color .3s,transform .3s,background .3s}
.project:hover{transform:translateY(-4px);border-color:#a58c64;background:#20211b}
.index{display:flex;justify-content:space-between}.index b{color:var(--accent);font-weight:400}
.visual{height:220px;margin:24px -21px 20px;position:relative;overflow:hidden;background:#20221c}
.visual:before{content:"";position:absolute;inset:-40%;opacity:.75;background:repeating-radial-gradient(ellipse at 50% 50%,transparent 0 19px,rgba(197,168,120,.22) 20px 21px,transparent 22px 39px);transform:rotate(-18deg) scale(1.2)}
.visual:after{content:"";position:absolute;inset:0;background:linear-gradient(90deg,transparent 49.8%,rgba(197,168,120,.18) 50%,transparent 50.2%),linear-gradient(0deg,transparent 49.8%,rgba(197,168,120,.18) 50%,transparent 50.2%);background-size:62px 62px;opacity:.45}
.visual svg{position:absolute;inset:0;width:100%;height:100%;z-index:1}
.project:nth-child(2) .visual{background:#20221f}.project:nth-child(2) .visual:before{transform:rotate(31deg) scale(1.4);background:repeating-linear-gradient(0deg,transparent 0 17px,rgba(197,168,120,.18) 18px 19px,transparent 20px 38px)}
.project:nth-child(3) .visual{background:#22211c}.project:nth-child(3) .visual:before{transform:rotate(-40deg) scale(1.5);background:repeating-radial-gradient(ellipse at 20% 70%,transparent 0 15px,rgba(197,168,120,.2) 16px 17px,transparent 18px 33px)}
.project h2{font-size:29px;letter-spacing:-.055em;font-weight:600;margin:0}
.bottom{display:flex;align-items:center;justify-content:space-between;margin-top:auto;padding-top:17px;border-top:1px solid var(--line)}
.launch{color:var(--accent)}.arrow{font-size:20px;color:var(--accent);transition:transform .25s}.project:hover .arrow{transform:translate(3px,-3px)}
footer{border-top:1px solid var(--line);padding:23px 0 30px;display:flex;justify-content:space-between;gap:16px}
@media(max-width:850px){main{padding:72px 0}.projects{grid-template-columns:1fr}.project{min-height:280px;display:grid;grid-template-columns:1fr 42%;grid-template-rows:auto 1fr auto;column-gap:20px}.index{grid-column:1/-1}.visual{grid-column:2;grid-row:2/4;height:180px;margin:18px -21px 0 0}.project h2{grid-column:1;grid-row:2;align-self:end}.bottom{grid-column:1;grid-row:3}}
@media(max-width:520px){.shell{width:calc(100% - 36px)}header{height:72px}.meta{font-size:8px}main{padding:58px 0}h1{margin-bottom:42px}.project{min-height:235px;grid-template-columns:1fr 38%;column-gap:10px}.visual{height:150px}.project h2{font-size:24px}footer{font-size:8px;flex-wrap:wrap}}
@media(prefers-reduced-motion:reduce){*{transition:none!important}}
</style>
</head>
