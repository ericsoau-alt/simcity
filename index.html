<!doctype html>
<html lang="en">
<head>
<meta charset="utf-8">
<meta name="viewport" content="width=device-width,initial-scale=1">
<meta name="theme-color" content="#e9e6dc">
<title>SimCity — Games</title>
<link href="https://fonts.googleapis.com/css2?family=Manrope:wght@400;500;600;700;800&display=swap" rel="stylesheet">
<style>
*{box-sizing:border-box}
body{margin:0;background:#e9e6dc;color:#252923;font-family:Manrope,Arial,sans-serif}
.wrap{width:min(1180px,calc(100% - 40px));margin:auto}
header{height:70px;display:flex;align-items:center;justify-content:space-between}
.logo{font-size:17px;font-weight:800;letter-spacing:.13em}.logo span{color:#6b8060}
header small{font-size:10px;letter-spacing:.15em;color:#73786d}
.hero{height:clamp(250px,34vw,390px);position:relative;overflow:hidden;background:#9db9b2}
.hero svg{width:100%;height:100%;display:block}
.hero:after{content:"";position:absolute;inset:35% 0 0;background:linear-gradient(transparent,rgba(20,35,31,.55))}
.hero-title{position:absolute;z-index:1;left:clamp(22px,5vw,58px);bottom:30px;color:white;text-shadow:0 2px 10px #26332d}
.hero-title small{font-size:10px;letter-spacing:.2em;text-transform:uppercase}
.hero-title h1{font-size:clamp(27px,4vw,44px);font-weight:700;margin:7px 0 0;letter-spacing:-.04em}
main{padding:34px 0 58px}
.section-head{display:flex;align-items:center;justify-content:space-between;margin-bottom:16px}
.section-head h2{font-size:17px;margin:0;font-weight:700}
.section-head span{font-size:10px;color:#74796f;letter-spacing:.12em}
.games{display:grid;grid-template-columns:repeat(3,1fr);gap:16px}
.game{display:block;background:#f7f6f1;color:inherit;text-decoration:none;border:1px solid #d3d1c7;transition:transform .18s,border-color .18s}
.game:hover{transform:translateY(-3px);border-color:#8b9a7e}
.thumb{height:150px;overflow:hidden;background:#aab8a1}
.thumb svg{display:block;width:100%;height:100%}
.game-info{display:flex;align-items:center;justify-content:space-between;padding:15px 17px}
.game h3{font-size:18px;margin:0;font-weight:700}
.arrow{font-size:20px;color:#718468}
footer{padding:17px 0 25px;border-top:1px solid #d0cec3;color:#777b72;font-size:10px;letter-spacing:.1em}
@media(max-width:720px){.games{grid-template-columns:1fr}.thumb{height:190px}.hero{height:260px}header small{font-size:8px}}
</style>
</head>
